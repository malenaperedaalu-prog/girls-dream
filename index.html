<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Girls Dreams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* =========================================================
   COLORES Y TIPOGRAFÍAS (cambiá estos valores y cambia todo)
   ========================================================= */
:root {
  --fondo: #17111c;        /* negro ciruela */
  --fondo-2: #221a29;      /* paneles */
  --sangre: #7a1f2b;       /* rojo vino */
  --sangre-claro: #a3303f;
  --plata: #b8b2a7;        /* plata vieja */
  --vela: #c9a45c;         /* dorado de vela */
  --hueso: #e8e0d0;        /* texto principal */
  --linea: #3a2e40;
  --fuente-titulo: "UnifrakturCook", "Old English Text MT", Georgia, serif;
  --fuente-texto: "EB Garamond", Garamond, Georgia, serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }

body {
  margin: 0;
  background: var(--fondo);
  color: var(--hueso);
  font-family: var(--fuente-texto);
  font-size: 1.15rem;
  line-height: 1.6;
}
img, svg { max-width: 100%; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--vela); outline-offset: 3px; }

/* ================= ENCABEZADO ================= */
.encabezado {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding: .75rem clamp(1rem, 4vw, 3rem);
  background: rgba(23, 17, 28, .94);
  border-bottom: 1px solid var(--linea);
}
.marca { display: flex; align-items: center; gap: .75rem; text-decoration: none; color: var(--hueso); }
/* Lugar reservado para el logo: reemplazá el <div> por <img src="logo.png"> */
.logo-lugar {
  width: 48px; height: 48px;
  border: 1px dashed var(--plata);
  border-radius: 50%;
  display: grid; place-items: center;
  font-size: .65rem; color: var(--plata); text-align: center; line-height: 1.1;
}
.marca-nombre { font-family: var(--fuente-titulo); font-size: 1.7rem; }
.menu { display: flex; gap: 1.5rem; }
.menu a { color: var(--plata); text-decoration: none; }
.menu a:hover { color: var(--hueso); }
.boton-carrito {
  background: none; border: 1px solid var(--vela); color: var(--vela);
  padding: .4rem 1rem; border-radius: 999px; cursor: pointer; font-size: 1rem;
}
.boton-carrito:hover { background: var(--vela); color: var(--fondo); }

/* ================= PORTADA ================= */
.portada {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 2rem;
  padding: clamp(2rem, 6vw, 5rem) clamp(1rem, 4vw, 3rem);
  max-width: 1200px; margin: 0 auto;
}
.portada h1 {
  font-family: var(--fuente-titulo);
  font-size: clamp(3rem, 9vw, 7rem);
  line-height: .95;
  margin: 0 0 1rem;
  color: var(--hueso);
  text-shadow: 0 0 30px rgba(122, 31, 43, .6);
}
.portada p { max-width: 38ch; color: var(--plata); margin: 0 0 1.5rem; }
.boton-principal {
  display: inline-block;
  background: var(--sangre); color: var(--hueso);
  border: none; padding: .8rem 1.8rem; font-size: 1.1rem;
  text-decoration: none; cursor: pointer;
  clip-path: polygon(8% 0, 92% 0, 100% 50%, 92% 100%, 8% 100%, 0 50%);
}
.boton-principal:hover { background: var(--sangre-claro); }

/* Ventana en forma de arco gótico (el elemento característico) */
.ventana {
  width: clamp(200px, 28vw, 320px);
  aspect-ratio: 3 / 4.4;
  background:
    radial-gradient(circle at 50% 30%, rgba(201,164,92,.35), transparent 55%),
    linear-gradient(180deg, #2c1f33, var(--sangre));
  clip-path: path("M0 100% L0 45% Q0 0 50% 0 Q100% 0 100% 45% L100% 100% Z");
  border-radius: 50% 50% 0 0 / 35% 35% 0 0;
  position: relative;
  display: grid; place-items: center;
  box-shadow: inset 0 0 0 6px var(--fondo), inset 0 0 0 7px var(--vela);
}
.ventana svg { width: 55%; }

/* ================= FILTROS ================= */
.tienda { max-width: 1200px; margin: 0 auto; padding: 0 clamp(1rem, 4vw, 3rem) 4rem; }
.tienda h2 { font-family: var(--fuente-titulo); font-size: 2.6rem; margin: 0 0 1rem; }
.controles { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; margin-bottom: 2rem; }
.filtro {
  background: none; color: var(--plata);
  border: 1px solid var(--linea); padding: .35rem 1rem; border-radius: 999px;
  cursor: pointer; font-size: 1rem;
}
.filtro[aria-pressed="true"] { border-color: var(--vela); color: var(--vela); }
.buscador {
  margin-left: auto;
  background: var(--fondo-2); color: var(--hueso);
  border: 1px solid var(--linea); padding: .45rem .9rem; font-size: 1rem;
  font-family: inherit; min-width: 200px;
}

/* ================= PRODUCTOS ================= */
.grilla {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 2rem 1.5rem;
}
.producto { display: flex; flex-direction: column; }
/* cada foto va dentro de un arco */
.producto-foto {
  aspect-ratio: 4 / 5;
  background: var(--fondo-2);
  border-radius: 50% 50% 4px 4px / 32% 32% 4px 4px;
  border: 1px solid var(--linea);
  display: grid; place-items: center;
  overflow: hidden;
}
.producto-foto svg { width: 50%; }
.producto-foto img { width: 100%; height: 100%; object-fit: cover; }
.producto h3 { margin: .8rem 0 0; font-size: 1.2rem; font-weight: 600; }
.producto .categoria { color: var(--plata); font-size: .95rem; font-style: italic; }
.producto .fila { display: flex; justify-content: space-between; align-items: center; margin-top: .5rem; }
.precio { color: var(--vela); font-size: 1.2rem; }
.agregar {
  background: none; border: 1px solid var(--sangre-claro); color: var(--hueso);
  padding: .3rem .8rem; cursor: pointer; font-size: .95rem;
}
.agregar:hover { background: var(--sangre); }
.vacio { color: var(--plata); font-style: italic; }
.foto-wrap { position: relative; }
.corazon {
  position: absolute; bottom: .6rem; right: .6rem;
  width: 2.4rem; height: 2.4rem; border-radius: 50%;
  background: rgba(23, 17, 28, .85); border: 1px solid var(--linea);
  color: var(--plata); font-size: 1.3rem; line-height: 1; cursor: pointer;
  display: grid; place-items: center;
}
.corazon:hover { border-color: var(--sangre-claro); color: var(--hueso); }
.corazon[aria-pressed="true"] { color: var(--sangre-claro); border-color: var(--sangre-claro); }

/* ================= CARRITO (panel lateral) ================= */
.carrito {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: min(380px, 100%);
  background: var(--fondo-2);
  border-left: 1px solid var(--vela);
  padding: calc(1.5rem + env(safe-area-inset-top, 0px)) 1.5rem calc(1.5rem + env(safe-area-inset-bottom, 0px));
  transform: translateX(100%);
  transition: transform .3s ease;
  z-index: 20;
  display: flex; flex-direction: column;
}
.carrito.abierto { transform: translateX(0); }
.carrito h2 { font-family: var(--fuente-titulo); font-size: 2rem; margin: 0 0 1rem; }
.cerrar { position: absolute; top: calc(1rem + env(safe-area-inset-top, 0px)); right: 1rem; background: none; border: none; color: var(--plata); font-size: 1.6rem; cursor: pointer; }
.lista-carrito { list-style: none; padding: 0; margin: 0; flex: 1; overflow-y: auto; }
.lista-carrito li { display: flex; justify-content: space-between; gap: .5rem; padding: .6rem 0; border-bottom: 1px solid var(--linea); }
.cantidad { display: flex; align-items: center; gap: .4rem; }
.cantidad button { background: none; border: 1px solid var(--linea); color: var(--hueso); width: 1.8rem; height: 1.8rem; cursor: pointer; }
.total { display: flex; justify-content: space-between; font-size: 1.3rem; margin: 1rem 0; }
.total span:last-child { color: var(--vela); }
.fondo-oscuro { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 15; display: none; }
.fondo-oscuro.visible { display: block; }

/* ================= PIE ================= */
.pie { border-top: 1px solid var(--linea); text-align: center; padding: 2rem 1rem; color: var(--plata); font-size: .95rem; }

/* ================= CELULAR ================= */
@media (max-width: 720px) {
  .menu { display: none; }
  .portada { grid-template-columns: 1fr; text-align: center; }
  .portada p { margin-inline: auto; }
  .ventana { margin: 0 auto; }
  .buscador { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: reduce) { .carrito { transition: none; } }
</style>
</head>
<body>

<header class="encabezado">
  <a class="marca" href="#">
    <div class="logo-lugar">tu logo</div>
    <span class="marca-nombre" id="nombreTienda">Girls Dreams</span>
  </a>
  <nav class="menu">
    <a href="#tienda">Productos</a>
    <a href="#contacto">Contacto</a>
  </nav>
  <button class="boton-carrito" id="abrirCarrito">Carrito (<span id="contador">0</span>)</button>
</header>

<main>
  <section class="portada">
    <div>
      <h1>Accesorios para la noche</h1>
      <p>Pines, pulseras y llaveros hechos a mano, para llevar un poco de oscuridad a donde vayas.</p>
      <a class="boton-principal" href="#tienda">Ver productos</a>
    </div>
    <div class="ventana" aria-hidden="true">
      <!-- luna y murciélago -->
      <svg viewBox="0 0 100 100">
        <circle cx="50" cy="42" r="26" fill="#e8e0d0" opacity=".9"/>
        <circle cx="60" cy="36" r="24" fill="#3a2440"/>
        <path d="M20 72 q8 -8 14 0 q4 -6 8 -2 q2 -6 8 -6 q6 0 8 6 q4 -4 8 2 q6 -8 14 0 q-10 0 -14 8 q-4 -4 -8 0 q-4 -3 -8 3 q-4 -6 -8 -3 q-4 -4 -8 0 q-4 -8 -14 -8z" fill="#17111c"/>
      </svg>
    </div>
  </section>

  <section class="tienda" id="tienda">
    <h2>Productos</h2>
    <div class="controles" id="filtros">
      <!-- los botones de categoría se crean solos desde JavaScript -->
      <input class="buscador" id="buscador" type="search" placeholder="Buscar producto…" aria-label="Buscar producto">
    </div>
    <div class="grilla" id="grilla"></div>
  </section>
</main>

<footer class="pie" id="contacto">
  <p>Contacto: tuemail@ejemplo.com · Instagram: @tutienda</p>
  <p>Proyecto de Programación</p>
</footer>

<!-- Carrito -->
<div class="fondo-oscuro" id="fondoOscuro"></div>
<aside class="carrito" id="carrito" aria-label="Carrito de compras">
  <button class="cerrar" id="cerrarCarrito" aria-label="Cerrar carrito">×</button>
  <h2>Tu carrito</h2>
  <ul class="lista-carrito" id="listaCarrito"></ul>
  <div class="total"><span>Total</span><span id="total">$0</span></div>
  <button class="boton-principal" id="finalizar">Finalizar compra</button>
</aside>

<script>
/* =========================================================
   1) CONFIGURACIÓN — cambiá el nombre de la tienda acá
   ========================================================= */
const NOMBRE_TIENDA = "Girls Dreams";
document.getElementById("nombreTienda").textContent = NOMBRE_TIENDA;
document.title = NOMBRE_TIENDA;

/* =========================================================
   2) DIBUJOS de ejemplo (después los reemplazan por fotos)
   ========================================================= */
const dibujos = {
  luna: '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="30" fill="#e8e0d0"/><circle cx="62" cy="42" r="28" fill="#221a29"/></svg>',
  murcielago: '<svg viewBox="0 0 100 100"><path d="M10 45 q12 -10 20 2 q6 -8 12 -2 q2 -10 8 -10 q6 0 8 10 q6 -6 12 2 q8 -12 20 -2 q-14 2 -18 14 q-6 -6 -12 0 q-4 -4 -10 4 q-6 -8 -10 -4 q-6 -6 -12 0 q-4 -12 -18 -14z" fill="#b8b2a7"/></svg>',
  rosa: '<svg viewBox="0 0 100 100"><circle cx="50" cy="40" r="18" fill="#7a1f2b"/><path d="M40 38 q10 -12 20 0 q-10 8 -20 0z" fill="#a3303f"/><path d="M50 58 v30" stroke="#4a6b3a" stroke-width="4"/><path d="M50 72 q-12 -6 -16 2 q10 4 16 -2z" fill="#4a6b3a"/></svg>',
  llave: '<svg viewBox="0 0 100 100"><circle cx="50" cy="28" r="14" fill="none" stroke="#c9a45c" stroke-width="6"/><path d="M50 42 v44 M50 70 h12 M50 80 h10" stroke="#c9a45c" stroke-width="6"/></svg>',
  arana: '<svg viewBox="0 0 100 100"><g stroke="#b8b2a7" stroke-width="3" fill="none"><path d="M50 50 L20 30 M50 50 L15 50 M50 50 L20 70 M50 50 L30 85 M50 50 L80 30 M50 50 L85 50 M50 50 L80 70 M50 50 L70 85"/></g><circle cx="50" cy="45" r="9" fill="#e8e0d0"/><circle cx="50" cy="58" r="12" fill="#e8e0d0"/></svg>',
  cadena: '<svg viewBox="0 0 100 100"><g fill="none" stroke="#b8b2a7" stroke-width="5"><ellipse cx="30" cy="50" rx="14" ry="9"/><ellipse cx="50" cy="50" rx="14" ry="9"/><ellipse cx="70" cy="50" rx="14" ry="9"/></g></svg>'
};

/* =========================================================
   3) PRODUCTOS — agregá, borrá o cambiá productos acá.
   Cada producto usa una foto de FOTOS (arriba del script)
   ========================================================= */
const productos = [
  { id: 1, nombre: "Llavero Cruz y Mariposa Roja", categoria: "Llaveros", precio: 4500, imagen: FOTOS.llavero_cruz },
  { id: 2, nombre: "Llavero Estrella y Bolas 8",    categoria: "Llaveros", precio: 3800, imagen: FOTOS.llavero_estrella },
  { id: 3, nombre: "Pulsera Murciélago Rojo y Negro", categoria: "Pulseras", precio: 4800, imagen: FOTOS.pulsera_murcielago },
  { id: 4, nombre: "Pulseras Cuentas Negras y Cruz",  categoria: "Pulseras", precio: 4500, imagen: FOTOS.pulsera_negra },
  { id: 5, nombre: "Alfileres con Cadenas y Cruces",  categoria: "Pines",    precio: 3200, imagen: FOTOS.alfileres },
  { id: 6, nombre: "Set de 9 Chapitas Góticas",       categoria: "Pines",    precio: 8500, imagen: FOTOS.chapitas }
];

/* =========================================================
   4) LÓGICA DE LA TIENDA
   ========================================================= */
let categoriaActual = "Todos";
let textoBusqueda = "";
let carrito = cargarCarrito(); // { idProducto: cantidad }
let favoritos = cargarFavoritos(); // [ idProducto, idProducto, ... ]

// Formatea números como pesos argentinos: 2500 -> $2.500
const pesos = n => "$" + n.toLocaleString("es-AR");

// Crea los botones de filtro a partir de las categorías que existen
function crearFiltros() {
  const categorias = ["Todos", ...new Set(productos.map(p => p.categoria)), "Favoritos"];
  const contenedor = document.getElementById("filtros");
  const buscador = document.getElementById("buscador");
  categorias.forEach(cat => {
    const b = document.createElement("button");
    b.className = "filtro";
    b.dataset.cat = cat;
    b.textContent = cat === "Favoritos" ? "♥ Favoritos (" + favoritos.length + ")" : cat;
    b.setAttribute("aria-pressed", cat === categoriaActual);
    b.onclick = () => {
      categoriaActual = cat;
      document.querySelectorAll(".filtro").forEach(f => f.setAttribute("aria-pressed", f.dataset.cat === cat));
      mostrarProductos();
    };
    contenedor.insertBefore(b, buscador);
  });
}

// Dibuja las tarjetas de producto según el filtro y la búsqueda
function mostrarProductos() {
  const grilla = document.getElementById("grilla");
  const lista = productos.filter(p =>
    (categoriaActual === "Todos" ||
      (categoriaActual === "Favoritos" ? favoritos.includes(p.id) : p.categoria === categoriaActual)) &&
    p.nombre.toLowerCase().includes(textoBusqueda.toLowerCase())
  );

  if (lista.length === 0) {
    grilla.innerHTML = categoriaActual === "Favoritos" && textoBusqueda === ""
      ? '<p class="vacio">Todavía no tenés favoritos. Tocá el corazón ♡ de un producto para guardarlo acá.</p>'
      : '<p class="vacio">No hay productos con ese nombre. Probá con otra palabra o elegí "Todos".</p>';
    return;
  }

  grilla.innerHTML = lista.map(p => `
    <article class="producto">
      <div class="foto-wrap">
        <div class="producto-foto">
          ${p.imagen ? `<img src="${p.imagen}" alt="${p.nombre}">` : dibujos[p.dibujo]}
        </div>
        <button class="corazon" onclick="alternarFavorito(${p.id})"
          aria-pressed="${favoritos.includes(p.id)}"
          aria-label="${favoritos.includes(p.id) ? "Quitar de favoritos" : "Agregar a favoritos"}: ${p.nombre}">${favoritos.includes(p.id) ? "♥" : "♡"}</button>
      </div>
      <h3>${p.nombre}</h3>
      <span class="categoria">${p.categoria}</span>
      <div class="fila">
        <span class="precio">${pesos(p.precio)}</span>
        <button class="agregar" onclick="agregar(${p.id})">Agregar</button>
      </div>
    </article>
  `).join("");
}

// Poner o sacar un producto de favoritos
function alternarFavorito(id) {
  favoritos = favoritos.includes(id) ? favoritos.filter(f => f !== id) : [...favoritos, id];
  guardarFavoritos();
  const boton = document.querySelector('.filtro[data-cat="Favoritos"]');
  if (boton) boton.textContent = "♥ Favoritos (" + favoritos.length + ")";
  mostrarProductos();
}
function guardarFavoritos() {
  try { localStorage.setItem("favoritos", JSON.stringify(favoritos)); } catch (e) {}
}
function cargarFavoritos() {
  try {
    const guardados = JSON.parse(localStorage.getItem("favoritos"));
    return Array.isArray(guardados) ? guardados : [];
  } catch (e) { return []; }
}

function agregar(id) {
  carrito[id] = (carrito[id] || 0) + 1;
  actualizarCarrito();
}

function cambiarCantidad(id, cambio) {
  carrito[id] += cambio;
  if (carrito[id] <= 0) delete carrito[id];
  actualizarCarrito();
}

function actualizarCarrito() {
  const lista = document.getElementById("listaCarrito");
  const ids = Object.keys(carrito);
  let total = 0, cantidadTotal = 0;

  if (ids.length === 0) {
    lista.innerHTML = '<li class="vacio">Tu carrito está vacío. Agregá algo desde Productos.</li>';
  } else {
    lista.innerHTML = ids.map(id => {
      const p = productos.find(x => x.id == id);
      const cant = carrito[id];
      total += p.precio * cant;
      cantidadTotal += cant;
      return `<li>
        <div>${p.nombre}<br><small>${pesos(p.precio * cant)}</small></div>
        <div class="cantidad">
          <button onclick="cambiarCantidad(${id}, -1)" aria-label="Quitar uno">−</button>
          ${cant}
          <button onclick="cambiarCantidad(${id}, 1)" aria-label="Agregar uno">+</button>
        </div>
      </li>`;
    }).join("");
  }

  document.getElementById("total").textContent = pesos(total);
  document.getElementById("contador").textContent = cantidadTotal;
  guardarCarrito();
}

// Guardar el carrito en el navegador para que no se pierda al recargar
function guardarCarrito() {
  try { localStorage.setItem("carrito", JSON.stringify(carrito)); } catch (e) {}
}
function cargarCarrito() {
  try { return JSON.parse(localStorage.getItem("carrito")) || {}; } catch (e) { return {}; }
}

// Abrir y cerrar el panel del carrito
function abrirCarrito(abrir) {
  document.getElementById("carrito").classList.toggle("abierto", abrir);
  document.getElementById("fondoOscuro").classList.toggle("visible", abrir);
}
document.getElementById("abrirCarrito").onclick = () => abrirCarrito(true);
document.getElementById("cerrarCarrito").onclick = () => abrirCarrito(false);
document.getElementById("fondoOscuro").onclick = () => abrirCarrito(false);

document.getElementById("buscador").oninput = e => { textoBusqueda = e.target.value; mostrarProductos(); };

// Botón de finalizar compra (por ahora solo muestra un mensaje)
document.getElementById("finalizar").onclick = () => {
  if (Object.keys(carrito).length === 0) { alert("Agregá al menos un producto para finalizar la compra."); return; }
  alert("¡Gracias por tu compra! (Acá después se puede conectar el pago o WhatsApp)");
  carrito = {};
  actualizarCarrito();
  abrirCarrito(false);
};

// Arrancar
crearFiltros();
mostrarProductos();
actualizarCarrito();
</script>
</body>
</html>
